<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - dn42-dns 管理面板</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">🌐</div>
                <h1>dn42-dns</h1>
                <p>轻量级 DNS 分流服务器管理面板</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="admin123" autocomplete="current-password" required>
                </div>
                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="remember" checked>
                        <span>记住登录状态</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登录</button>
                <div id="loginError" class="error-message" style="display:none;"></div>
            </form>
            <div class="login-footer">
                <p>默认账号：admin / admin123</p>
            </div>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
