<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dn42-dns 管理面板</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="logo">🌐</span>
            <span class="brand">dn42-dns</span>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-page="dashboard">
                <span class="nav-icon">📊</span>
                <span class="nav-text">仪表盘</span>
            </a>
            <a href="#" class="nav-item" data-page="cache">
                <span class="nav-icon">💾</span>
                <span class="nav-text">缓存管理</span>
            </a>
            <a href="#" class="nav-item" data-page="rdns">
                <span class="nav-icon">🔍</span>
                <span class="nav-text">rDNS 记录</span>
            </a>
            <a href="#" class="nav-item" data-page="upstreams">
                <span class="nav-icon">🔗</span>
                <span class="nav-text">上游服务器</span>
            </a>
            <a href="#" class="nav-item" data-page="ha">
                    <span class="nav-icon">🔄</span>
                    <span class="nav-text">主从状态</span>
                </a>
                <a href="#" class="nav-item" data-page="mail">
                    <span class="nav-icon">📮</span>
                    <span class="nav-text">邮局DNS</span>
                </a>
                <a href="#" class="nav-item" data-page="settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">系统设置</span>
                </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <span class="user-avatar">👤</span>
                <span class="user-name" id="usernameDisplay">admin</span>
            </div>
            <a href="#" id="logoutBtn" class="logout-btn">退出</a>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 顶部栏 -->
        <header class="topbar">
            <h1 class="page-title" id="pageTitle">仪表盘</h1>
            <div class="topbar-right">
                <span class="status-badge" id="healthBadge">
                    <span class="status-dot"></span>
                    <span id="healthText">检查中...</span>
                </span>
            </div>
        </header>

        <!-- 页面内容 -->
        <div class="page-content" id="pageContent">
            <!-- 动态加载 -->
        </div>
    </main>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
